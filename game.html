<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ston Paper And Scissor</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
   <h1>Rock Paper Scissors</h1>
   <div class="selection">
        <div class="selections" id="rock">
            <img src="rock.jpeg"></img>
        </div>

        <div class="selections" id="paper">
            <img src="paper.jpeg"></img>
        </div>

        <div class="selections" id="scissors">
            <img src="scissor.jpeg"></img>
        </div>
   </div>

   <div class="score-board">
        <div class="score">
            <p id="your-score">0</p>
            <p>Yours</p>
        </div>
          <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
   </div>

   <div class="msg-conainer">
        <div id="msg">Play your move</div>
   </div>

    
    <script src="js.js"></script>
</body>
</html>
